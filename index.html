.app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:transparent}
header{text-shadow:0 0 3px #000,0 1px 3px #000;background:transparent;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 12px}
.langs{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.langs select{flex:1;min-width:0;font:inherit;font-weight:700;padding:9px 8px;border-radius:10px;border:0;background:#fff;color:#063d36;text-shadow:none}
#swap{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:1.2rem;cursor:pointer}
#num{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:0;background:#fff;color:#111;text-shadow:none}
#num::placeholder,#txt::placeholder{color:rgba(0,0,0,.6)}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.empty{margin:auto;text-align:center;font-size:.9rem;padding:14px 18px;background:#fff;border-radius:14px;max-width:85%;font-weight:600}
.b{max-width:85%;padding:8px 11px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.12);word-break:break-word}
.b.out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:3px}
.b.in{align-self:flex-start;background:#fff;border-top-left-radius:3px}
.b .m{white-space:pre-wrap;font-size:1rem}
.b .o{white-space:pre-wrap;font-size:.78rem;opacity:.65;margin-top:5px;padding-top:5px;border-top:1px dashed rgba(0,0,0,.2)}
.b .t{font-size:.66rem;opacity:.55;margin-top:3px;text-align:right}
footer{background:transparent;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;padding:7px;border-radius:999px;border:1px solid #075e54;background:#fff;color:#075e54;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.tabs button.on{background:#075e54;color:#fff}
#prev{min-height:1.2em;font-size:.85rem;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 1px 3px #000;margin-bottom:4px;white-space:pre-wrap;word-break:break-word}
#prev.err{color:#ffb4ab}
.chk{font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 1px 3px #000;display:flex;gap:6px;align-items:center;font-size:.82rem;margin-bottom:6px}
#txt{width:100%;font:inherit;color:#111;background:#fff;padding:10px 12px;border-radius:12px;border:1px solid #ccc;resize:vertical;min-height:70px;max-height:180px}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;padding:12px;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}
.go{background:#25d366;color:#fff;border:0}
.go:disabled{opacity:.6}
.clr{background:#fff;color:#b3261e;border:2px solid #b3261e}
.paste{background:#128c7e;color:#fff;border:0}
.note2{font-size:.74rem;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 1px 3px #000;margin:-2px 0 6px}
</style>

<body>
<div class="app">
  <header>
    <div class="langs">
      <select id="lmy" aria-label="Bahasa saya"></select>
      <button id="swap" type="button" aria-label="Tukar bahasa">⇄</button>
      <select id="lto" aria-label="Bahasa lawan bicara"></select>
    </div>
    <input id="num" type="tel" inputmode="tel" autocomplete="tel" placeholder="No. WhatsApp (08123456789 atau +14155550123)">
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div class="tabs">
      <button type="button" id="tsend" class="on">Kirim pesan</button>
      <button type="button" id="trecv">Terjemahkan balasan</button>
    </div>
    <div id="prev"></div>
    <label class="chk" id="chkw"><input type="checkbox" id="orig"> Sertakan teks asli di bawah terjemahan</label>
    <label class="chk"><input type="checkbox" id="autop" checked> Tempel otomatis saat kembali ke aplikasi</label>
    <label class="chk"><input type="checkbox" id="follow" checked> Ikuti bahasa pelanggan (balasan saya otomatis dalam bahasanya)</label>
    <div class="note2">Salin balasan pelanggan di WhatsApp, lalu kembali ke sini: isinya otomatis dideteksi bahasanya &amp; diterjemahkan ke bahasa Anda.</div>
    <textarea id="txt" rows="3" dir="auto" placeholder="Ketik pesan..."></textarea>
    <div class="btns">
      <button type="button" class="go" id="go">Send WA</button>
      <button type="button" class="paste" id="pst">📋 Tempel</button>
      <button type="button" class="clr" id="clr">Clear chat</button>
    </div>
  </footer>
</div>

<script>
/* Opsional: isi email agar kuota gratis MyMemory naik (dari ~5.000 jadi ~50.000 karakter/hari) */
var MYMEMORY_EMAIL="";

var LANGS=[["id","🇮🇩","Indonesia"],["en","🇬🇧","English"],["es","🇪🇸","Español"],["fr","🇫🇷","Français"],["ru","🇷🇺","Русский"],["zh-CN","🇨🇳","中文"],["ar","🇸🇦","العربية"],["hi","🇮🇳","हिन्दी"],["ja","🇯🇵","日本語"],["ko","🇰🇷","한국어"],["de","🇩🇪","Deutsch"],["pt","🇵🇹","Português"]];
var $=function(i){return document.getElementById(i)};
var mode="send",hist=[],cache={},timer=null,seq=0;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function langName(c){for(var i=0;i<LANGS.length;i++)if(LANGS[i][0]===c)return LANGS[i][1]+" "+LANGS[i][2];return c}

/* ---------- terjemahan (MyMemory, gratis tanpa API key) ---------- */
function decode(s){var t=document.createElement("textarea");t.innerHTML=s;return t.value}
var MAXB=400; /* batas MyMemory 500 BYTE per permintaan */
function blen(x){return new TextEncoder().encode(x).length}
function sentences(line){
  var out=[],cur="",i,c,n;
  for(i=0;i<line.length;i++){
    c=line.charAt(i);cur+=c;
    if(".!?。！？".indexOf(c)>-1){
      n=line.charAt(i+1);
      if("。！？".indexOf(c)>-1||n===""||/\s/.test(n)){
        while(i+1<line.length&&/[.!?。！？"'”’)\]]/.test(line.charAt(i+1))){cur+=line.charAt(++i)}
        while(i+1<line.length&&/\s/.test(line.charAt(i+1))){cur+=line.charAt(++i)}
        out.push(cur);cur="";
      }
    }
  }
  if(cur)out.push(cur);
  return out;
}
function cutBytes(p){
  var ch=Array.from(p),b=0,i=0,sp=-1;
  for(;i<ch.length;i++){var l=blen(ch[i]);if(b+l>MAXB)break;b+=l;if(/\s/.test(ch[i]))sp=i}
  if(i<ch.length&&sp>0)i=sp+1;
  return [ch.slice(0,i).join(""),ch.slice(i).join("")];
}
function pieces(line){
  var out=[],cur="";
  sentences(line).forEach(function(p){
    while(blen(p)>MAXB){var c=cutBytes(p);if(cur){out.push(cur);cur=""}out.push(c[0]);p=c[1]}
    if(blen(cur+p)>MAXB){if(cur)out.push(cur);cur=p}else cur+=p;
  });
  if(cur)out.push(cur);
  return out.filter(function(x){return x.trim()});
}
async function trPiece(q,from,to){
  var u="https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+encodeURIComponent(from+"|"+to)+(MYMEMORY_EMAIL?"&de="+encodeURIComponent(MYMEMORY_EMAIL):"");
  var r=await fetch(u);
  if(!r.ok)throw new Error("server "+r.status);
  var j=await r.json();
  var t=j&&j.responseData&&j.responseData.translatedText;
  if(!t||(j.responseStatus&&Number(j.responseStatus)!==200)||/MYMEMORY WARNING/i.test(t)){
    throw new Error(Number(j.responseStatus)===429||/MYMEMORY WARNING/i.test(t||"")?"kuota gratis hari ini habis":"terjemahan gagal");
  }
  return decode(t);
}
async function trRaw(text,from,to){
  var lines=text.split("\n"),out=[],sep=(to==="ja"||to==="zh-CN")?"":" ";
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(!ln.trim()){out.push("");continue}
    var ps=pieces(ln),res="";
    for(var k=0;k<ps.length;k++)res+=(res?sep:"")+(await trPiece(ps[k],from,to)).trim();
    out.push(res.trim());
  }
  return out.join("\n");
}
function same(a,b){return a.replace(/\s+/g,"").toLowerCase()===b.replace(/\s+/g,"").toLowerCase()}
async function tr(text,from,to){
  if(from===to)return text;
  var key=from+"|"+to+"|"+text;
  if(cache[key])return cache[key];
  var r=await trRaw(text,from,to);
  /* hasil sama dengan aslinya = bahasa sumber kemungkinan salah -> coba deteksi otomatis */
  if(same(r,text)&&(text.match(/\p{L}/gu)||[]).length>=3){
    try{var r2=await trRaw(text,"Autodetect",to);if(!same(r2,text))r=r2}catch(e){}
  }
  cache[key]=r;
  return r;
}

/* ---------- nomor WhatsApp ---------- */
function normPhone(v){
  v=String(v||"").trim();
  var plus=v.charAt(0)==="+",d=v.replace(/\D/g,"");
  if(!d)return "";
  if(!plus){
    if(d.indexOf("00")===0)d=d.slice(2);
    else if(d.charAt(0)==="0")d="62"+d.slice(1);
  }
  return d.length>=9&&d.length<=15?d:"";
}

/* ---------- riwayat chat ---------- */
function save(){store("wa_tr_hist",JSON.stringify(hist.slice(-60)))}
function render(){
  var c=$("chat");c.innerHTML="";
  if(!hist.length){var e=document.createElement("div");e.className="empty";e.textContent="Belum ada percakapan. Pilih bahasa, isi nomor WhatsApp, lalu tulis pesan.";c.appendChild(e);return}
  hist.forEach(function(h){
    var b=document.createElement("div");b.className="b "+h.t;
    var m=document.createElement("div");m.className="m";m.dir="auto";m.textContent=h.x;
    var o=document.createElement("div");o.className="o";o.dir="auto";o.textContent=h.o;
    var t=document.createElement("div");t.className="t";t.textContent=(h.t==="out"?"Terkirim ke WA · ":"Balasan · ")+langName(h.t==="out"?h.to:h.from)+" · "+h.time;
    b.appendChild(m);if(h.o!==h.x)b.appendChild(o);b.appendChild(t);c.appendChild(b);
  });
  c.scrollTop=c.scrollHeight;
}
function add(t,o,x,from,to){
  var d=new Date(),p=function(n){return (n<10?"0":"")+n};
  hist.push({ts:Date.now(),t:t,o:o,x:x,from:from,to:to,time:p(d.getHours())+":"+p(d.getMinutes())});
  save();render();
}

/* ---------- pratinjau terjemahan ---------- */
function msg(s,err){var p=$("prev");p.textContent=s;p.className=err?"err":""}
function dirs(){var my=$("lmy").value,to=$("lto").value;return mode==="send"?[my,to]:[to,my]}
function preview(){
  clearTimeout(timer);
  var txt=$("txt").value.trim();
  if(!txt){msg("");return}
  var d=dirs(),id=++seq;
  if(mode==="recv")d=[detectSrc(txt,$("lto").value).code,$("lmy").value];
  msg("Menerjemahkan...");
  timer=setTimeout(function(){
    tr(txt,d[0],d[1]).then(function(r){if(id===seq)msg("→ "+langName(d[1])+":\n"+r)}).catch(function(e){if(id===seq)msg("Gagal menerjemahkan: "+e.message,true)});
  },700);
}

/* ---------- aksi ---------- */
function setMode(m){
  mode=m;
  $("tsend").className=m==="send"?"on":"";
  $("trecv").className=m==="recv"?"on":"";
  $("go").textContent=m==="send"?"Send WA":"Terjemahkan";
  $("chkw").style.display=m==="send"?"flex":"none";
  $("txt").placeholder=m==="send"?"Ketik pesan Anda...":"Tempel pesan balasan dari pelanggan...";
  preview();
}
$("tsend").onclick=function(){setMode("send")};
$("trecv").onclick=function(){setMode("recv")};
$("txt").oninput=preview;
$("txt").addEventListener("paste",function(){if(mode!=="recv")return;setTimeout(function(){if($("txt").value.trim())$("go").click()},60)});
$("lmy").onchange=$("lto").onchange=function(){store("wa_tr_my",$("lmy").value);store("wa_tr_to",$("lto").value);preview()};
$("num").onchange=function(){store("wa_tr_num",$("num").value)};
$("swap").onclick=function(){var a=$("lmy").value;$("lmy").value=$("lto").value;$("lto").value=a;$("lmy").onchange()};

$("go").onclick=async function(){
  var txt=$("txt").value.trim(),btn=$("go");
  if(!txt){msg("Tulis pesan dulu.",true);return}
  var my=$("lmy").value,to=$("lto").value;
  if(mode==="recv"){
    btn.disabled=true;msg("Menerjemahkan...");
    try{await incoming(txt);$("txt").value="";msg("")}
    catch(e){msg("Gagal menerjemahkan: "+e.message,true)}
    btn.disabled=false;return;
  }
  var ph=normPhone($("num").value);
  if(!ph){msg("Isi nomor WhatsApp yang valid (contoh 08123456789 atau +14155550123).",true);$("num").focus();return}
  store("wa_tr_num",$("num").value);
  btn.disabled=true;msg("Menerjemahkan...");
  /* buka tab saat klik agar tidak diblokir browser */
  var w=window.open("about:blank","_blank");
  try{
    var r2=await tr(txt,my,to);
    var out=($("orig").checked&&my!==to)?r2+"\n\n("+txt+")":r2;
    var url="https://wa.me/"+ph+"?text="+encodeURIComponent(out);
    if(w)w.location.href=url;else location.href=url;
    add("out",txt,r2,my,to);
    $("txt").value="";msg("");
  }catch(e){
    if(w)w.close();
    msg("Gagal menerjemahkan: "+e.message,true);
  }
  btn.disabled=false;
};

$("clr").onclick=function(){
  if(hist.length&&!confirm("Hapus semua riwayat chat di layar ini?"))return;
  hist=[];save();render();$("txt").value="";msg("");
};

/* ---------- deteksi bahasa balasan pelanggan (otomatis) ---------- */
var SW={
 id:"yang dan saya ini itu tidak untuk dengan ada mau bisa terima kasih halo berapa pesan tolong sudah belum jam dari akan atau juga ke di apa kapan tempat".split(" "),
 en:"the and you is are to of for please thank thanks hello hi can would want how what we my it with this that have do not yes no ok order".split(" "),
 es:"el la los las de que por para con una un hola gracias quiero favor es en está estoy muy más como si".split(" "),
 fr:"le la les des et est je vous pour merci bonjour avec une pas nous suis très s'il plaît ça au du oui".split(" "),
 de:"der die das und ich ist nicht ein bitte danke hallo mit für ja nein sie wir haben auch".split(" "),
 pt:"os as não para com uma obrigado olá você por favor sim está eu muito".split(" ")
};
var LATIN=["id","en","es","fr","de","pt"];
function detectSrc(t,fb){
  var s=t||"";
  if(/[\u0400-\u04FF]/.test(s))return{code:"ru",conf:1};
  if(/[\u0600-\u06FF]/.test(s))return{code:"ar",conf:1};
  if(/[\u0900-\u097F]/.test(s))return{code:"hi",conf:1};
  if(/[\uAC00-\uD7AF]/.test(s))return{code:"ko",conf:1};
  if(/[\u3040-\u30FF]/.test(s))return{code:"ja",conf:1};
  if(/[\u4E00-\u9FFF]/.test(s))return{code:"zh-CN",conf:1};
  var w=s.toLowerCase().match(/[a-zà-ÿñ']+/g)||[],sc={};
  LATIN.forEach(function(k){sc[k]=0});
  w.forEach(function(x){LATIN.forEach(function(k){if(SW[k].indexOf(x)>-1)sc[k]++})});
  if(/[ñ¿¡]/.test(s))sc.es+=2;
  if(/[ãõ]/.test(s))sc.pt+=2;
  if(/[ßäöü]/i.test(s))sc.de+=2;
  if(/[èêàçœ]/i.test(s))sc.fr+=1;
  var ks=LATIN.slice().sort(function(a,b){return sc[b]-sc[a]}),b=ks[0],s2=ks[1];
  if(sc[b]>=1&&sc[b]>sc[s2])return{code:b,conf:sc[b]>=2?1:0};
  return{code:LATIN.indexOf(fb)>-1?fb:"en",conf:0};
}
async function incoming(t){
  var my=$("lmy").value,cur=$("lto").value,d=detectSrc(t,cur),from=d.code;
  var last=hist[hist.length-1];
  if(last&&last.t==="in"&&last.o===t&&Date.now()-(last.ts||0)<10000)return;
  var r=/\p{L}/u.test(t)?await tr(t,from,my):t;
  if(d.conf&&$("follow").checked&&from!==my&&from!==cur){$("lto").value=from;store("wa_tr_to",from)}
  add("in",t,r,from,my);
}

/* ---------- tempel otomatis balasan dari clipboard ---------- */
var lastPaste=store("wa_tr_lastpaste")||"",pBusy=false;
function skipClip(t){
  return !t||t.length>1000||!/\p{L}/u.test(t)||/^https?:\/\/\S+$/i.test(t)||(!/\s/.test(t)&&t.length>=8&&/\d/.test(t)&&/[A-Za-z]/.test(t));
}
async function pasteReply(auto){
  if(pBusy)return;pBusy=true;
  try{
    var t;
    try{t=String(await navigator.clipboard.readText()||"").trim()}
    catch(e){if(!auto)msg("Browser tidak mengizinkan membaca clipboard. Tekan lama kolom teks lalu pilih Tempel.",true);return}
    if(!t){if(!auto)msg("Clipboard kosong.",true);return}
    if(auto&&(t===lastPaste||skipClip(t)))return;
    if(auto&&hist.some(function(h){return h.t==="out"&&(h.o===t||h.x===t)}))return;
    if(t.length>1000)t=t.slice(0,1000);
    msg("Menempel & menerjemahkan...");
    lastPaste=t;store("wa_tr_lastpaste",t);
    try{await incoming(t);msg("")}
    catch(e){lastPaste="";store("wa_tr_lastpaste","");msg("Gagal menerjemahkan: "+e.message,true)}
  }finally{pBusy=false}
}
function onBack(){if($("autop").checked&&document.visibilityState==="visible")setTimeout(function(){pasteReply(true)},350)}
document.addEventListener("visibilitychange",onBack);
window.addEventListener("focus",onBack);
$("pst").onclick=function(){pasteReply(false)};
$("autop").checked=store("wa_tr_autop")!=="0";
$("autop").onchange=function(){store("wa_tr_autop",this.checked?"1":"0")};
$("follow").checked=store("wa_tr_follow")!=="0";
$("follow").onchange=function(){store("wa_tr_follow",this.checked?"1":"0")};

/* ---------- perbaiki balasan lama yang belum diterjemahkan ---------- */
async function fixOld(){
  var my=$("lmy").value;
  for(var i=0;i<hist.length;i++){
    var h=hist[i];
    if(h.t!=="in"||!/\p{L}/u.test(h.o)||!same(h.x,h.o))continue;
    var d=detectSrc(h.o,h.from);
    if(d.code===my)continue;
    try{
      var r=await tr(h.o,d.code,my);
      if(!same(r,h.o)){h.x=r;h.from=d.code;h.to=my;save();render()}
    }catch(e){break}
  }
}

/* ---------- mulai ---------- */
(function(){
  LANGS.forEach(function(l){
    [$("lmy"),$("lto")].forEach(function(s){var o=document.createElement("option");o.value=l[0];o.textContent=l[1]+" "+l[2];s.appendChild(o)});
  });
  $("lmy").value=store("wa_tr_my")||"id";
  $("lto").value=store("wa_tr_to")||"en";
  $("num").value=store("wa_tr_num")||"";
  try{hist=JSON.parse(store("wa_tr_hist")||"[]")||[]}catch(e){hist=[]}
  render();setMode("send");
  fixOld();
})();
</script>
